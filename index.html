<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <!-- Greeting -->
      <section id="greeting-section" class="card" aria-labelledby="greeting-heading">
        <h2 id="greeting-heading">Greeting</h2>
        <p id="greeting-label" class="greeting-label"></p>
        <p id="greeting-time" class="greeting-time"></p>
        <p id="greeting-date" class="greeting-date"></p>
        <p id="greeting-message" class="message" role="status" aria-live="polite"></p>
      </section>

      <!-- Focus Timer -->
      <section id="timer-section" class="card" aria-labelledby="timer-heading">
        <h2 id="timer-heading">Focus Timer</h2>
        <p id="timer-display" class="timer-display">25:00</p>
        <div class="timer-controls">
          <button type="button" id="timer-start">Start</button>
          <button type="button" id="timer-stop">Stop</button>
          <button type="button" id="timer-reset">Reset</button>
        </div>
        <p id="timer-message" class="message" role="status" aria-live="polite"></p>
      </section>

      <!-- To-Do List -->
      <section id="todo-section" class="card" aria-labelledby="todo-heading">
        <h2 id="todo-heading">To-Do List</h2>
        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">New task</label>
          <input
            type="text"
            id="todo-input"
            name="todo-input"
            placeholder="What needs to be done?"
            maxlength="200"
            autocomplete="off"
          />
          <button type="submit" id="todo-add">Add</button>
        </form>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="todo-message" class="message" role="status" aria-live="polite"></p>
      </section>

      <!-- Quick Links -->
      <section id="links-section" class="card" aria-labelledby="links-heading">
        <h2 id="links-heading">Quick Links</h2>
        <form id="links-form" class="links-form">
          <label class="sr-only" for="link-label-input">Link label</label>
          <input
            type="text"
            id="link-label-input"
            name="link-label-input"
            placeholder="Label"
            maxlength="50"
            autocomplete="off"
          />
          <label class="sr-only" for="link-url-input">Link URL</label>
          <input
            type="text"
            id="link-url-input"
            name="link-url-input"
            placeholder="https://example.com"
            maxlength="2048"
            autocomplete="off"
          />
          <button type="submit" id="link-add">Add</button>
        </form>
        <div id="links-buttons" class="links-buttons"></div>
        <p id="links-message" class="message" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="js/app.js" defer></script>
  </body>
</html>
